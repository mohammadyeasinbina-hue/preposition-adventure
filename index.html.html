<style>
:root{--ink:#1d2b4f;--a:#ff8a3d;--g:#1f9d55;--r:#d93a40;--b:#2f6fe4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans Bengali","Segoe UI",sans-serif;color:var(--ink);font-size:17px;line-height:1.5;background:linear-gradient(#8fd3ff,#d8f5c8 65%,#7ccf6b) fixed}

@keyframes bob{50%{transform:translateY(-8px)}}
h1,h2,h3{margin:.3em 0}
.big{font-size:56px;text-align:center;animation:bob 2s infinite;display:block}
.c{text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 16px;min-height:48px;background:var(--a);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22);margin:4px}
button:active{transform:translateY(3px);box-shadow:none}
button.s{background:var(--b)}button.ok{background:var(--g)}button.no{background:var(--r)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:4px solid #7c3aed;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.bar{height:14px;background:#dde5f5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.opt{display:block;width:100%;text-align:left;background:#eaf0ff;color:var(--ink);font-size:19px}
.opt.c1{background:var(--g);color:#fff}.opt.w1{background:var(--r);color:#fff}
.ex{background:#fff4de;border-left:6px solid var(--a);padding:8px 12px;border-radius:10px;margin:8px 0}
.q{font-size:21px;font-weight:700;margin:8px 0}
.fb{padding:10px;border-radius:12px;margin:8px 0;background:#eef7ee}.fb.bad{background:#fdecec}
.node{display:block;width:100%;text-align:left;font-size:19px}
.scene{position:relative;height:200px;background:linear-gradient(#cfeaff,#fff6dc);border-radius:16px;overflow:hidden;margin:8px 0}
.slab{position:absolute;left:25%;width:50%;top:58%;height:12px;background:#8b5a2b;border-radius:4px}
.leg{position:absolute;top:58%;width:8px;height:60px;background:#6b4423}.l1{left:27%}.l2{left:71%}
.ob{position:absolute;font-size:30px;translate:-50% 0}.ob.hl{filter:drop-shadow(0 0 6px #ff8a3d);animation:bob 1s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
